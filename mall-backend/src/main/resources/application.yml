spring:
  application:
    name: mall-system
  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mall_system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: '00000000'

  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

server:
  port: 8080
  servlet:
    context-path: /api

jwt:
  secret: your-secret-key-change-in-production-please-use-at-least-256-bits
  expiration: 86400000

redis:
  host: localhost
  port: 6379
  password:
  database: 0
  timeout: 3000
  lettuce:
    pool:
      max-active: 8
      max-wait: -1
      max-idle: 8
      min-idle: 0

logging:
  file:
    path: logs

---
# 开发环境配置
spring:
  config:
    activate:
      on-profile: dev

---
# 生产环境配置
spring:
  config:
    import: classpath:application-prod.yml
    activate:
      on-profile: prod
