version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mall_root_123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mall_system}
      MYSQL_USER: ${MYSQL_USER:-mall_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_123456}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mall-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: mall-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_123456}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mall-network

  # RocketMQ NameServer (ARM64/Mac 兼容性问题，已禁用)
  # 如需启用，请取消注释并确保在 x86_64 环境下运行
  # rocketmq-namesrv:
  #   image: apache/rocketmq:5.2.0
  #   platform: linux/amd64
  #   container_name: mall-rocketmq-namesrv
  #   restart: unless-stopped
  #   ports:
  #     - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
  #   environment:
  #     JAVA_OPT_EXT: "-Xms512m -Xmx512m"
  #   command: sh -c "rm -rf /home/rocketmq/logs/* && /home/rocketmq/rocketmq-5.2.0/bin/mqnamesrv"
  #   volumes:
  #     - rocketmq-logs:/home/rocketmq/logs
  #   networks:
  #     - mall-network

  # RocketMQ Broker (ARM64/Mac 兼容性问题，已禁用)
  # rocketmq-broker:
  #   image: apache/rocketmq:5.2.0
  #   platform: linux/amd64
  #   container_name: mall-rocketmq-broker
  #   restart: unless-stopped
  #   ports:
  #     - "${ROCKETMQ_BROKER_PORT:-10909}:10909"
  #     - "${ROCKETMQ_BROKER_HTTP_PORT:-10911}:10911"
  #     - "${ROCKETMQ_BROKER_ADMIN_PORT:-10912}:10912"
  #   environment:
  #     JAVA_OPT_EXT: "-Xms1g -Xmx1g"
  #     NAMESRV_ADDR: "rocketmq-namesrv:9876"
  #   command: sh -c "rm -rf /home/rocketmq/store/* /home/rocketmq/logs/* && /home/rocketmq/rocketmq-5.2.0/bin/mqbroker -c /home/rocketmq/conf/broker.conf"
  #   volumes:
  #     - rocketmq-store:/home/rocketmq/store
  #     - rocketmq-logs:/home/rocketmq/logs
  #     - ./docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf
  #   depends_on:
  #     rocketmq-namesrv:
  #       condition: service_started
  #   networks:
  #     - mall-network

  # RocketMQ Console (可选，用于管理 RocketMQ)
  # rocketmq-console:
  #   image: apacherocketmq/rocketmq-dashboard:latest
  #   container_name: mall-rocketmq-console
  #   restart: unless-stopped
  #   ports:
  #     - "${ROCKETMQ_CONSOLE_PORT:-8180}:8080"
  #   environment:
  #     JAVA_OPTS: "-Xms256m -Xmx256m -Drocketmq.namesrv.addr=rocketmq-namesrv:9876"
  #   depends_on:
  #     - rocketmq-namesrv
  #   networks:
  #     - mall-network

  # Spring Boot 应用
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mall-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-mall_system}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-mall_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-mall_pass_123456}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_123456}
      SPRING_AUTOCONFIGURE_EXCLUDE: org.apache.rocketmq.spring.autoconfigure.RocketMQAutoConfiguration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      TZ: Asia/Shanghai
    volumes:
      - app-logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mall-network

# 数据卷
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rocketmq-store:
    driver: local
  rocketmq-logs:
    driver: local
  app-logs:
    driver: local

# 网络
networks:
  mall-network:
    driver: bridge
